<!doctype html>
<html lang="en"><head><script>/* the live preview lives on Render; send GitHub Pages visitors there */if(/\.github\.io$/.test(location.hostname)){location.replace('https://newman-preview.onrender.com/'+location.pathname.replace(/^\/newman\/redesign-v1\/?/,'')+location.search+location.hash);}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Sign in | Admin preview | Newman Plastic Surgery</title><link rel="icon" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../assets/css/fonts.css?v=20261127j"><link rel="stylesheet" href="../assets/css/styles.css?v=20261127j"><link rel="stylesheet" href="../assets/css/admin.css?v=20261127j">
<style>.si{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--teal-950)}.card{width:100%;max-width:440px;background:var(--ivory);border-radius:var(--r-xl);padding:34px 30px}.card img{height:40px;margin-bottom:22px}.card h1{font:400 38px/1.05 var(--sans);letter-spacing:-.04em;margin:0 0 8px}.card h1 em{font-family:var(--serif);color:var(--clay-ink)}.code{display:flex;gap:8px;margin:18px 0}.code input{width:100%;min-height:58px;text-align:center;font:500 26px var(--sans);border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0}</style></head>
<body class="adm si"><main class="card">
<img src="../assets/img/logo.png" alt="Newman Plastic Surgery"><p class="eyebrow" style="font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--clay-ink)">Admin preview </p>
<div id="s1"><h1>Sign <em>in.</em></h1><p class="intro">Enter the Admin password to manage the website.</p>
<label class="field-a" style="margin-top:16px">Password<input type="password" id="pw" autocomplete="current-password"></label>
<p class="pv" id="msg" role="alert" style="color:var(--clay-ink);min-height:22px"></p>
<button class="btn btn--ink" id="go" type="button" style="margin-top:6px;width:100%">Sign in</button></div>
<p class="pv" style="margin-top:22px">At launch, the Admin also asks for a 6-digit code sent to each person’s email, signs you out after a period of inactivity and emails you when someone signs in from a new device.</p>
</main>
<script>
var $=function(s){return document.querySelector(s);};
function go(){
  var pw=$('#pw').value; if(!pw){$('#pw').focus();return;}
  $('#go').disabled=true; $('#msg').textContent='';
  fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
    .then(function(r){ if(r.status===404||r.status===405){ location.href='index.html'; return null; } return r.json().then(function(j){return {ok:r.ok,j:j};}); })
    .then(function(x){ if(!x) return; if(x.ok){ location.href='index.html'; } else { $('#go').disabled=false; $('#msg').textContent=(x.j&&x.j.error)||'That password was not right.'; $('#pw').select(); } })
    .catch(function(){ $('#go').disabled=false; $('#msg').textContent='Could not reach the server. Please try again.'; });
}
$('#go').onclick=go; $('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
</script></body></html>
