# Render Blueprint: password-protected client preview with a working Admin.
# One small Node web service serves the site, the Admin and the contact form.
# Saved Admin work lives on the attached disk (so it survives restarts and redeploys).
services:
  - type: web
    runtime: node
    name: newman-preview
    repo: https://github.com/cph32789/newman
    branch: main
    plan: starter
    buildCommand: echo "nothing to build"
    startCommand: node server/preview-server.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: newman-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: PREVIEW_PASSWORD     # the password for the whole preview (enter it in Render)
        sync: false
      - key: ADMIN_PASSWORD       # optional: a separate password for /admin (defaults to the preview password)
        sync: false
      - key: NOTIFY_TO            # optional: email address that receives new requests
        sync: false
      - key: RESEND_API_KEY       # optional: lets the server email new requests (free at resend.com)
        sync: false
